plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup 'com.terraformersmc'
		}
	}
	mavenCentral()
}

loom {
	// SRS §3.1: everything in this mod is client-side, so a dedicated `client`
	// source set holds all production code (mirrors ShulkerPickBlock/ContainerSort).
	splitEnvironmentSourceSets()

	mods {
		"texturebuilder" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// SRS §3.2 / §7.4: only widen access where a compile-time error is actually hit.
	// None encountered with the current design, so this stays commented out.
	// accessWidenerPath = file("src/main/resources/texturebuilder.accesswidener")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// 1.20 jars are obfuscated, so Loom remaps them. Official Mojang mappings keep the
	// source on the same Mojmap names as the 26.x branches (the jar is remapped to
	// intermediary on build, as every 1.20 Fabric mod is).
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu is compile-only (FR-22): it supplies the `ModMenuApi`/`ConfigScreenFactory`
	// interfaces implemented by `compat.modmenu.ModMenuIntegration`, but is NOT required at
	// runtime. Loader only instantiates the `modmenu` entrypoint when Mod Menu is installed,
	// so that class is never loaded otherwise and no NoClassDefFoundError is possible.
	modCompileOnly("com.terraformersmc:modmenu:${project.mod_menu_version}") { transitive = false }
}

java {
	// MC 1.20 targets Java 17 (the version Mojang ships with it).
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}

	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = 'UTF-8'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// Matches the naming convention used by the other mods in this modpack, e.g.
// "shulker-pick-block - 26.3 - 1.1.0.jar": "<name> - <minecraft_version> - <mod_version>".
def outputBaseName = "${project.archives_base_name} - ${project.minecraft_version} - ${project.mod_version}"

// The jar Loom produces before remapping is a dev-only intermediate; keep it out of the way
// so build/libs holds just the remapped, distributable jar under the modpack name.
jar {
	archiveClassifier = "dev"

	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

remapJar {
	archiveFileName = "${outputBaseName}.jar"
}

remapSourcesJar {
	archiveFileName = "${outputBaseName}-sources.jar"
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
