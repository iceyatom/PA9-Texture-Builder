# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties - confirmed versions for Minecraft 26.2 (SRS §2; verified against
# https://meta.fabricmc.net on 2026-08-06). NOTE: no Yarn mappings exist for 26.x -
# 26.x jars ship Mojmap names already, so NO `mappings` dependency is declared at all
# (same empirical finding as the ShulkerPickBlock project; see CLAUDE.md).
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.yourname.texturebuilder
archives_base_name=texture-builder

# Dependencies
fabric_api_version=0.155.2+26.2
# Mod Menu - compile-only, for the config screen entrypoint (FR-22). 20.0.0-beta.4 is the
# 26.2-compatible build verified in-game by the ShulkerPickBlock project.
mod_menu_version=20.0.0-beta.4
