# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties - confirmed versions for Minecraft 26.3 (verified against
# https://meta.fabricmc.net on 2026-09-17). NOTE: no Yarn mappings exist for 26.x -
# 26.x jars ship Mojmap names already, so NO `mappings` dependency is declared at all
# (same empirical finding as the ShulkerPickBlock project; see CLAUDE.md).
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17.21

# Mod Properties
mod_version=1.0.0
maven_group=com.yourname.texturebuilder
archives_base_name=texture-builder

# Dependencies
fabric_api_version=0.160.6+26.3
# Mod Menu - compile-only, for the config screen entrypoint (FR-22).
# 21.0.0-beta.1 is published for Minecraft 26.3.
mod_menu_version=21.0.0-beta.1
