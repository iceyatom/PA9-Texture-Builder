# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties - Minecraft 1.20.2 (backport of the 26.3 release; verified against
# https://meta.fabricmc.net and maven.fabricmc.net on 2026-10-19). 1.20.2 is obfuscated, so
# build.gradle uses Loom's remapping plugin with official Mojang mappings.
minecraft_version=1.20.2
loader_version=0.19.5
loom_version=1.17.21

# Mod Properties
mod_version=1.0.1
maven_group=com.yourname.texturebuilder
archives_base_name=texture-builder

# Dependencies
fabric_api_version=0.91.6+1.20.2
# Mod Menu - compile-only, for the config screen entrypoint (FR-22).
# 8.0.1 is the final Mod Menu release for Minecraft 1.20.2.
mod_menu_version=8.0.1
